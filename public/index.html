<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Website Knowledge Chatbot</title>
<meta name="description" content="Assessment demo: a chatbot grounded only in seven PlacidWay pages about ITC Immunity Therapy Center.">
<style>
  :root{
    --bg:#f4f6f8; --panel:#ffffff; --ink:#18212b; --muted:#5d6b78; --line:#e2e7ec;
    --brand:#0b6e74; --brand-ink:#ffffff; --user:#e8f3f3; --chip:#eef3f6; --warn:#fff6e5; --warn-line:#f1d59a;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f1418; --panel:#161d23; --ink:#e6edf2; --muted:#9aa8b4; --line:#26313a;
      --brand:#2aa1a8; --brand-ink:#061113; --user:#173033; --chip:#1d272f; --warn:#2a2416; --warn-line:#5a4a22; }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       display:flex;justify-content:center}
  .app{width:100%;max-width:760px;height:100%;display:flex;flex-direction:column;padding:0 16px}
  header{padding:18px 0 12px;border-bottom:1px solid var(--line)}
  header h1{font-size:18px;margin:0}
  header p{margin:4px 0 0;color:var(--muted);font-size:13px}
  #log{flex:1;overflow-y:auto;padding:16px 0;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:88%;padding:10px 14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);word-wrap:break-word}
  .msg.user{align-self:flex-end;background:var(--user);border-color:transparent}
  .msg p{margin:0 0 8px} .msg p:last-child{margin:0}
  .msg ul{margin:4px 0 8px;padding-left:20px}
  .sources{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
  .sources a{font-size:12px;background:var(--chip);color:var(--ink);text-decoration:none;padding:3px 9px;border-radius:999px;border:1px solid var(--line)}
  .sources a:hover{border-color:var(--brand)}
  .sources span{font-size:12px;color:var(--muted);align-self:center}
  .disclaimer{font-size:12px;background:var(--warn);border:1px solid var(--warn-line);border-radius:10px;padding:8px 12px;color:var(--ink)}
  .lead{margin-top:10px;display:grid;gap:6px;grid-template-columns:1fr 1fr auto}
  .lead input{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;min-width:0}
  .lead small{grid-column:1/-1;color:var(--muted)}
  @media (max-width:560px){ .lead{grid-template-columns:1fr} }
  .suggest{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 10px}
  .suggest button{font:inherit;font-size:13px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer}
  form#ask{display:flex;gap:8px;padding:12px 0 18px;border-top:1px solid var(--line)}
  #q{flex:1;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;min-width:0}
  button.primary{background:var(--brand);color:var(--brand-ink);border:0;border-radius:12px;padding:0 18px;font:inherit;font-weight:600;cursor:pointer}
  button.primary:disabled{opacity:.6;cursor:default}
  .typing{color:var(--muted);font-size:13px}
  footer{font-size:11px;color:var(--muted);padding-bottom:10px;text-align:center}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Treatment &amp; cost assistant</h1>
    <p>Answers only from 7 PlacidWay pages about ITC Immunity Therapy Center, Tijuana. Every answer links its source.</p>
  </header>
  <div id="log" aria-live="polite"></div>
  <div class="suggest" id="suggest">
    <button>How much does adrenal cancer treatment cost?</button>
    <button>What is included in the out-patient program?</button>
    <button>Where is the clinic located?</button>
    <button>¿Cuánto cuesta el tratamiento de cáncer de mama?</button>
  </div>
  <form id="ask" autocomplete="off">
    <input id="q" placeholder="Ask about treatments, packages or prices…" maxlength="1000" aria-label="Your question">
    <button class="primary" id="send">Send</button>
  </form>
  <footer>Assessment demo, not an official PlacidWay service. Not medical advice.</footer>
</div>
<script>
const log = document.getElementById('log');
const q = document.getElementById('q');
const send = document.getElementById('send');
const chatHistory = [];
let disclaimerShown = false;

function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
// Minimal markdown: paragraphs, bullet lists, **bold**.
function md(text){
  const lines = esc(text).split('\n'); let html='', inList=false;
  for (const raw of lines){
    const line = raw.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
    const li = line.match(/^\s*[-*•]\s+(.*)/);
    if (li){ if(!inList){html+='<ul>';inList=true;} html+=`<li>${li[1]}</li>`; continue; }
    if (inList){html+='</ul>';inList=false;}
    if (line.trim()) html+=`<p>${line}</p>`;
  }
  return html + (inList?'</ul>':'');
}
function bubble(cls, html){
  const d=document.createElement('div'); d.className='msg '+cls; d.innerHTML=html; log.appendChild(d);
  log.scrollTop=log.scrollHeight; return d;
}
function leadForm(container, quoteUrl){
  const f=document.createElement('form'); f.className='lead';
  f.innerHTML=`<input name="name" placeholder="Your name" required>
    <input name="email" type="email" placeholder="Email" required>
    <button class="primary">Request a quote</button>
    <small>Or use PlacidWay's own form: <a href="${quoteUrl}" target="_blank" rel="noopener">request a free quote</a></small>`;
  f.onsubmit=async e=>{
    e.preventDefault();
    const body={name:f.name.value,email:f.email.value,note:chatHistory.filter(h=>h.role==='user').slice(-3).map(h=>h.content).join(' | ')};
    const r=await fetch('/api/lead',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const j=await r.json();
    f.outerHTML = j.ok ? `<p class="typing">Thanks ${esc(body.name)}, your details were recorded for a follow-up about your quote.</p>`
                       : `<p class="typing">${esc(j.error||'Could not save, please try again.')}</p>`;
  };
  container.appendChild(f);
}
async function ask(text){
  text=text.trim(); if(!text) return;
  document.getElementById('suggest').style.display='none';
  bubble('user', esc(text)); q.value=''; send.disabled=true;
  const wait=bubble('bot','<span class="typing">Checking the pages…</span>');
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:text,history:chatHistory.slice(-6)})});
    const j=await r.json();
    let html=md(j.answer||'');
    if (j.sources && j.sources.length){
      html+='<div class="sources"><span>Source:</span>'+j.sources.map(s=>`<a href="${s.url}" target="_blank" rel="noopener">${esc(s.title)}</a>`).join('')+'</div>';
    }
    wait.innerHTML=html;
    if (j.offer_lead) leadForm(wait, j.quote_url);
    if (j.show_disclaimer && !disclaimerShown){
      disclaimerShown=true;
      const d=document.createElement('div'); d.className='disclaimer';
      d.textContent='This assistant shares information from PlacidWay pages only. It is not medical advice; please discuss treatment decisions with your doctor.';
      log.appendChild(d);
    }
    chatHistory.push({role:'user',content:text},{role:'assistant',content:j.answer||''});
  }catch(e){ wait.innerHTML='<p>Sorry, I could not reach the server. Please try again.</p>'; }
  send.disabled=false; q.focus(); log.scrollTop=log.scrollHeight;
}
document.getElementById('ask').onsubmit=e=>{e.preventDefault(); ask(q.value);};
document.querySelectorAll('#suggest button').forEach(b=>b.onclick=()=>ask(b.textContent));
bubble('bot', md("Hi! Ask me about ITC Immunity Therapy Center's cancer treatment packages, prices or what's included. I answer only from PlacidWay's pages and link the page each answer comes from."));
</script>
</body>
</html>
